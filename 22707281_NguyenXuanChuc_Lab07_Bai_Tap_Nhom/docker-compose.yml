version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    env_file: ./user-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  movie-service:
    build: ./movie-service
    container_name: movie-service
    ports:
      - "8082:8082"
    env_file: ./movie-service/.env
    depends_on:
      - mongo
    restart: unless-stopped

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8083:8083"
    env_file: ./booking-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  payment-notification-service:
    build: ./payment-notification-service
    container_name: payment-notification-service
    ports:
      - "8084:8084"
    env_file: ./payment-notification-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    env_file: ./api-gateway/.env
    depends_on:
      - user-service
      - movie-service
      - booking-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8085:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  rabbitmq_data:
  mongo_data:
